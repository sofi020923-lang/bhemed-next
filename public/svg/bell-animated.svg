<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3688B8"/>
      <stop offset="100%" style="stop-color:#24566F"/>
    </linearGradient>
  </defs>
  <!-- Campana -->
  <g transform="translate(50, 50)">
    <motion.path
      d="M-18 -20 C-18 -28 -8 -32 8 -32 C24 -32 34 -28 34 -20 C34 -10 8 0 8 0 C8 0 -8 -10 -18 -20 Z"
      fill="url(#bellGrad)"
      animate={{ rotate: [-15, 15, -15] }}
      transition={{ duration: 1.5, repeat: Infinity, ease: 'easeInOut' }}
    />
    <motion.line
      x1="0" y1="10" x2="0" y2="20"
      stroke="#FFFFFF" strokeWidth="3" strokeLinecap="round"
      animate={{ opacity: [1, 0.3, 1], scaleY: [1, 1.3, 1] }}
      transition={{ duration: 1.5, repeat: Infinity, delay: 0.2 }}
    />
  </g>
  <!-- Ondas de sonido -->
  <motion.circle cx="50" cy="50" r="50" fill="none" stroke="#3688B8" strokeWidth="1" strokeOpacity="0.3" animate={{ r: [40, 55, 40], strokeOpacity: [0.4, 0, 0.4] }} transition={{ duration: 3, repeat: Infinity }} />
  <motion.circle cx="50" cy="50" r="35" fill="none" stroke="#3688B8" strokeWidth="1" strokeOpacity="0.2" animate={{ r: [30, 45, 30], strokeOpacity: [0.3, 0, 0.3] }} transition={{ duration: 3, repeat: Infinity, delay: 1 }} />
</svg>