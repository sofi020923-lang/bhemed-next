<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3688B8"/>
      <stop offset="100%" style="stop-color:#24566F"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F1F5"/>
      <stop offset="100%" style="stop-color:#3688B8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3688B8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Fondo circular animado -->
  <motion.circle
    cx="100" cy="100" r="90"
    fill="url(#grad2)"
    filter="url(#shadow)"
    animate={{ opacity: [0.3, 0.6, 0.3], r: [85, 95, 85] }}
    transition={{ duration: 4, repeat: Infinity, ease: 'easeInOut' }}
  />
  <!-- Corazón principal -->
  <g transform="translate(100, 100)">
    <motion.path
      d="M0 -30 C-20 -60, -60 -50, -60 -10 C-60 20, -20 40, 0 60 C20 40, 60 20, 60 -10 C60 -50, 20 -60, 0 -30 Z"
      fill="url(#grad1)"
      animate={{ scale: [1, 1.1, 1], rotate: [-5, 5, -5] }}
      transition={{ duration: 2, repeat: Infinity, ease: 'easeInOut' }}
    />
    <!-- Brillo interno -->
    <motion.path
      d="M-5 -20 C-10 -35, -25 -25, -20 0 C-15 20, 0 45, 0 45"
      fill="none"
      stroke="#FFFFFF"
      strokeWidth="3"
      strokeOpacity="0.6"
      animate={{ pathLength: [0, 1, 0], strokeOpacity: [0, 0.6, 0] }}
      transition={{ duration: 3, repeat: Infinity, ease: 'easeInOut' }}
    />
  </g>
  <!-- Partículas flotantes -->
  <motion.circle cx="50" cy="40" r="3" fill="#3688B8" animate={{ opacity: [0.4, 1, 0.4], cy: [35, 45, 35] }} transition={{ duration: 3, repeat: Infinity, delay: 0.5 }} />
  <motion.circle cx="160" cy="170" r="2" fill="#24566F" animate={{ opacity: [0.4, 1, 0.4], cx: [155, 165, 155] }} transition={{ duration: 2.5, repeat: Infinity, delay: 1 }} />
  <motion.circle cx="30" cy="160" r="2" fill="#3688B8" animate={{ opacity: [0.4, 1, 0.4], cy: [155, 165, 155] }} transition={{ duration: 3.5, repeat: Infinity, delay: 1.5 }} />
  <motion.circle cx="170" cy="50" r="4" fill="#E8F1F5" animate={{ opacity: [0.3, 0.8, 0.3], cx: [165, 175, 165] }} transition={{ duration: 4, repeat: Infinity, delay: 2 }} />
</svg>