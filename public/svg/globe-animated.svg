<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3688B8"/>
      <stop offset="100%" style="stop-color:#24566F"/>
    </linearGradient>
  </defs>
  <!-- Mundo -->
  <motion.circle
    cx="50" cy="50" r="35"
    fill="url(#globeGrad)"
    animate={{ scale: [1, 1.05, 1] }}
    transition={{ duration: 4, repeat: Infinity, ease: 'easeInOut' }}
  />
  <!-- Meridianos -->
  <motion.line x1="50" y1="15" x2="50" y2="85" stroke="#FFFFFF" strokeWidth="1.5" strokeOpacity="0.5" animate={{ rotate: [-180, 180, -180] }} transition={{ duration: 10, repeat: Infinity, ease: 'linear' }} />
  <motion.ellipse cx="50" cy="50" rx="35" ry="12" fill="none" stroke="#FFFFFF" strokeWidth="1.5" strokeOpacity="0.4" animate={{ ry: [10, 15, 10], strokeOpacity: [0.3, 0.6, 0.3] }} transition={{ duration: 3, repeat: Infinity, ease: 'easeInOut' }} />
  <!-- Puntos de conexión -->
  <motion.circle cx="20" cy="30" r="3" fill="#FFFFFF" animate={{ opacity: [0.5, 1, 0.5] }} transition={{ duration: 2, repeat: Infinity }} />
  <motion.circle cx="80" cy="70" r="2" fill="#FFFFFF" animate={{ opacity: [0.5, 1, 0.5] }} transition={{ duration: 2.5, repeat: Infinity, delay: 0.5 }} />
  <motion.circle cx="70" cy="25" r="2" fill="#FFFFFF" animate={{ opacity: [0.5, 1, 0.5] }} transition={{ duration: 3, repeat: Infinity, delay: 1 }} />
</svg>