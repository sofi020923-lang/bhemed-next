<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3688B8"/>
      <stop offset="100%" style="stop-color:#24566F"/>
    </linearGradient>
  </defs>
  <!-- Escudo -->
  <motion.path
    d="M50 5 L90 20 L90 70 C90 90 50 95 50 95 C50 95 10 90 10 70 L10 20 Z"
    fill="url(#shieldGrad)"
    animate={{ scale: [1, 1.08, 1] }}
    transition={{ duration: 3, repeat: Infinity, ease: 'easeInOut' }}
  />
  <!-- Check mark -->
  <motion.path
    d="M30 50 L45 65 L70 35"
    stroke="#FFFFFF" strokeWidth="4" fill="none" strokeLinecap="round" strokeLinejoin="round"
    animate={{ pathLength: [0, 1, 0] }}
    transition={{ duration: 2.5, repeat: Infinity, delay: 0.5 }}
  />
</svg>